<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>耀才证券</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #fafafa;
    color: #333; display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; padding: 32px; max-width: 420px; width: 100%; }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 18px;
    background: linear-gradient(135deg, #c11815, #e5003d);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 700; color: #fff;
    box-shadow: 0 8px 24px rgba(193,24,21,.28);
    overflow: hidden;
  }
  h1 { font-size: 22px; letter-spacing: 2px; margin-bottom: 6px; color: #333; }
  .sub { font-size: 13px; color: #c9a063; margin-bottom: 36px; letter-spacing: 1px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid rgba(193,24,21,.12); border-top-color: #c11815;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 14px; color: #666; line-height: 1.8; min-height: 24px; }
  .line-list { margin-top: 22px; font-size: 12px; color: #aaa; line-height: 2; }
  .line-list b { color: #888; font-weight: 500; }
  .fail { display: none; }
  .fail .card {
    background: #fff; border: 1px solid #eee; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
    padding: 20px; margin-bottom: 14px; font-size: 14px; line-height: 2; color: #555;
  }
  .fail a { color: #c11815; text-decoration: none; }
  .retry-btn {
    display: inline-block; margin-top: 8px; padding: 12px 44px; border: none; border-radius: 23px;
    background: linear-gradient(135deg, #c11815, #e5003d); color: #fff; font-size: 15px;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 6px 18px rgba(193,24,21,.3);
  }
  .retry-btn:active { opacity: .88; }
</style>
</head>
<body>
<div class="box">
  <div class="logo" id="logoBox">耀</div>
  <h1 id="siteName">耀才证券</h1>
  <div class="sub" id="siteDesc">YAOCAI SECURITIES</div>

  <!-- 探测中 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="status" id="statusText">正在检测最优线路…</div>
    <div class="line-list" id="lineList"></div>
  </div>

  <!-- 全部不可用兜底 -->
  <div class="fail" id="failBox">
    <div class="card">
      当前网络线路暂时不可用，请稍后重试<br>
      或访问最新地址发布页：<br>
      <a href="https://www.115535.com" id="publishLink">www.115535.com</a>
      <span id="contactLines"></span>
    </div>
    <button class="retry-btn" onclick="location.reload()">重新检测</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ========== 配置区（打包后无需再改，域名变更在后台「域名池管理」维护） ========== */
  // 候选线路：与后台 site_domain 表保持一致，按优先级排列（APP 用 wap 端域名）
  var POOL = [
    'wap.222777.net',
    'www.yczq8.com',
    'www.yczq9.com'
  ];
  // 探活接口（后端轻量接口，CORS 已放开）
  var PING_PATH = '/api/site/ping.do';
  // 单条线路超时（毫秒）
  var TIMEOUT = 2500;
  // 最大重试轮数（全部失败后隔 1 秒再试一轮）
  var MAX_ROUND = 2;
  /* ========== 配置区结束 ========== */

  var statusText = document.getElementById('statusText');
  var lineList = document.getElementById('lineList');
  var failBox = document.getElementById('failBox');
  var loading = document.getElementById('loading');

  // 渲染线路清单
  lineList.innerHTML = POOL.map(function (d, i) {
    return '<div id="line-' + i + '"><b>线路' + (i + 1) + '</b>　' + d + '</div>';
  }).join('');

  function setLineState(i, state) {
    var el = document.getElementById('line-' + i);
    if (!el) return;
    if (state === 'ok') { el.style.color = '#22a06b'; el.innerHTML = '<b>线路' + (i + 1) + '</b>　' + POOL[i] + '　✓'; }
    else if (state === 'fail') { el.style.color = '#ccc'; el.innerHTML = '<b>线路' + (i + 1) + '</b>　' + POOL[i] + '　×'; }
  }

  // 单条线路探测：成功 resolve 域名，失败/超时 reject
  function probe(domain, index) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () {
        if (!done) { done = true; setLineState(index, 'fail'); reject(new Error('timeout')); }
      }, TIMEOUT);
      fetch('https://' + domain + PING_PATH + '?t=' + Date.now(), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store'
      }).then(function (res) {
        if (!done && res.ok) {
          done = true; clearTimeout(timer); setLineState(index, 'ok'); resolve(domain);
        } else if (!done) {
          done = true; clearTimeout(timer); setLineState(index, 'fail'); reject(new Error('http ' + res.status));
        }
      }).catch(function (e) {
        if (!done) { done = true; clearTimeout(timer); setLineState(index, 'fail'); reject(e); }
      });
    });
  }

  // 一轮并发探测：等全部结束后，按池内优先级取第一个可用线路（主站活着永远进主站）
  function probeAll() {
    return new Promise(function (resolve, reject) {
      var results = new Array(POOL.length);
      var settled = 0;
      POOL.forEach(function (d, i) {
        probe(d, i).then(function (domain) {
          results[i] = domain;
        }).catch(function () {
          results[i] = null;
        }).then(function () {
          settled++;
          if (settled === POOL.length) {
            var winner = null;
            for (var k = 0; k < results.length; k++) {
              if (results[k]) { winner = results[k]; break; }
            }
            if (winner) { resolve(winner); } else { reject(new Error('all down')); }
          }
        });
      });
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 拉取后台品牌信息（站点名/logo/客服），失败静默保持默认
  function loadBrand(domain) {
    var base = 'https://' + (domain || POOL[0]);
    var timer = setTimeout(function () { /* 超时静默 */ }, TIMEOUT);
    fetch(base + '/api/site/getInfo.do?t=' + Date.now(), { method: 'GET', mode: 'cors', cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (json) {
        clearTimeout(timer);
        if (!json || !json.data) return;
        var info = json.data;
        if (info.siteName && String(info.siteName).trim()) {
          document.getElementById('siteName').textContent = String(info.siteName).trim();
        }
        if (info.siteDescription && String(info.siteDescription).trim()) {
          document.getElementById('siteDesc').textContent = String(info.siteDescription).trim();
        }
        var logo = info.siteLogo || info.siteLogoSm;
        if (logo && String(logo).trim()) {
          var url = String(logo).trim();
          if (url.indexOf('://') < 0) { url = base + (url.charAt(0) === '/' ? '' : '/') + url; }
          var img = new Image();
          img.src = url;
          img.alt = 'logo';
          img.style.cssText = 'width:100%;height:100%;border-radius:18px;object-fit:cover;';
          img.onerror = function () { /* 加载失败保留默认"耀"字 */ };
          img.onload = function () {
            var box = document.getElementById('logoBox');
            box.textContent = '';
            box.appendChild(img);
          };
        }
        // 兜底页联系方式（后台没填的行不显示）
        var lines = [];
        if (info.sitePhone && String(info.sitePhone).trim()) {
          lines.push('客服电话：<b>' + esc(String(info.sitePhone).trim()) + '</b>');
        }
        if (info.siteQq && String(info.siteQq).trim()) {
          lines.push('客服 QQ：<b>' + esc(String(info.siteQq).trim()) + '</b>');
        }
        if (info.onlineService && String(info.onlineService).trim()) {
          var os = String(info.onlineService).trim();
          lines.push(os.indexOf('://') >= 0
            ? '<a href="' + esc(os) + '">在线客服</a>'
            : '在线客服：<b>' + esc(os) + '</b>');
        }
        if (lines.length) {
          document.getElementById('contactLines').innerHTML = '<br>' + lines.join('<br>');
        }
      })
      .catch(function () { /* 静默 */ });
  }

  function go(domain) {
    statusText.textContent = '已连接线路，正在进入…';
    // ?debug=1 时只渲染不跳转（用于预览启动页视觉）
    if (location.search.indexOf('debug') >= 0) {
      statusText.textContent = '调试模式：将进入 https://' + domain + '/（不自动跳转）';
      return;
    }
    // 进 wap 端（APP 主要面向移动端）；如需要 web 端改为 'https://' + domain + '/'
    location.replace('https://' + domain + '/');
  }

  function showFail() {
    loading.style.display = 'none';
    failBox.style.display = 'block';
  }

  function start(round) {
    statusText.textContent = round > 1 ? '正在重新检测线路（第 ' + round + ' 次）…' : '正在检测最优线路…';
    probeAll().then(function (domain) {
      loadBrand(domain);  // 用探测到的可用线路拉品牌信息，避免主域名失效时显示默认
      go(domain);
    }).catch(function () {
      if (round < MAX_ROUND) {
        setTimeout(function () { start(round + 1); }, 1000);
      } else {
        showFail();
      }
    });
  }

  loadBrand();
  start(1);
})();
</script>
</body>
</html>
